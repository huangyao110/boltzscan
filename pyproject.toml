[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boltzscan"
dynamic = ["version"]
description = "GRN inference via structural modeling of TFs and their targets"
requires-python = ">=3.10,<3.13"
readme = "README.md"
authors = [{ name = "huangyao" }]
dependencies = [
    "biopython>=1.84",
    "pandas>=2.0",
    "numpy>=1.26,<2.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "requests>=2.28",
]

[project.scripts]
boltzscan = "boltzscan.cli:main"

[tool.setuptools.dynamic]
version = {attr = "boltzscan.__version__"}

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["boltzscan*"]
# Preserve the vendored trees' on-disk layout in the wheel. At inference time
# their actual source roots are placed first on PYTHONPATH, so they still load
# as upstream top-level `boltz` and `esm` packages in their dedicated envs.
exclude = [
    "boltzscan.esm._assets*",
    "boltzscan.esm.cookbook*",
    "boltzscan.esm.tests*",
    "boltzscan.esm.tools*",
    "boltzscan.esm.esm.widgets*",
]

[tool.setuptools.package-data]
boltzscan = [
    "VENDORED_INFERENCE.json",
    "boltz/LICENSE",
    "boltz/README.md",
    "boltz/pyproject.toml",
    "boltz/src/boltz/*.py",
    "boltz/src/boltz/**/*.py",
    "esm/LICENSE.md",
    "esm/README.md",
    "esm/pyproject.toml",
    "esm/esm/*.py",
    "esm/esm/**/*.py",
    "esm/esm/data/*",
]

[tool.setuptools.exclude-package-data]
boltzscan = [
    "esm/esm/**/*_test.py",
    "esm/esm/widgets/**/*.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: requires network access or an external executable",
]
