[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boltzscan"
dynamic = ["version"]
description = "GRN inference via structural modeling of TFs and their targets"
requires-python = ">=3.10,<3.13"
readme = "README.md"
authors = [{ name = "huangyao" }]
dependencies = [
    "biopython>=1.84",
    "pandas>=2.0",
    "numpy>=1.26,<2.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "requests>=2.28",
]

[project.optional-dependencies]
# The inference source itself is vendored in boltzscan/boltz.  This extra
# installs the runtime used by that source without pulling it into lightweight
# PWM/FIMO-only installations.
boltz = [
    "torch>=2.2",
    "numpy>=1.26,<2.0",
    "hydra-core==1.3.2",
    "pytorch-lightning==2.5.0",
    "rdkit>=2024.3.2",
    "dm-tree==0.1.8",
    "requests==2.32.3",
    "pandas>=2.2.2",
    "types-requests",
    "einops==0.8.0",
    "einx==0.3.0",
    "fairscale==0.4.13",
    "mashumaro==3.14",
    "modelcif==1.2",
    "wandb==0.18.7",
    "click==8.1.7",
    "pyyaml==6.0.2",
    "biopython==1.84",
    "scipy==1.13.1",
    "numba==0.61.0",
    "gemmi==0.6.5",
    "scikit-learn==1.6.1",
    "chembl-structure-pipeline==1.2.2",
]

# ESM and the ESMFold2 input/output code are vendored in boltzscan/esm.  The
# Biohub Transformers fork supplies the ESMFold2 model implementation that is
# not present in the standard Transformers release.
esmfold2 = [
    "torch>=2.2.0",
    "transformers @ git+https://github.com/Biohub/transformers.git@main",
    "einops>=0.8",
    "biotite>=1.0.0",
    "rdkit>=2024.3.2",
    "msgpack-numpy",
    "scipy>=1.13",
    "brotli",
    "attrs",
    "cloudpathlib",
    "httpx",
    "tenacity",
    "zstd",
    "pydssp",
    "boto3",
    "pygtrie",
    "accelerate",
]

[project.scripts]
boltzscan = "boltzscan.cli:main"

[tool.setuptools.dynamic]
version = {attr = "boltzscan.__version__"}

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["boltzscan*"]
# Preserve the vendored trees' on-disk layout in the wheel. At inference time
# their actual source roots are placed first on PYTHONPATH, so they still load
# as upstream top-level `boltz` and `esm` packages in their dedicated envs.
exclude = [
    "boltzscan.esm._assets*",
    "boltzscan.esm.cookbook*",
    "boltzscan.esm.tests*",
    "boltzscan.esm.tools*",
    "boltzscan.esm.esm.widgets*",
]

[tool.setuptools.package-data]
boltzscan = [
    "VENDORED_INFERENCE.json",
    "boltz/LICENSE",
    "boltz/README.md",
    "boltz/pyproject.toml",
    "boltz/src/boltz/*.py",
    "boltz/src/boltz/**/*.py",
    "esm/LICENSE.md",
    "esm/README.md",
    "esm/pyproject.toml",
    "esm/esm/*.py",
    "esm/esm/**/*.py",
    "esm/esm/data/*",
]

[tool.setuptools.exclude-package-data]
boltzscan = [
    "esm/esm/**/*_test.py",
    "esm/esm/widgets/**/*.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: requires network access or an external executable",
]
